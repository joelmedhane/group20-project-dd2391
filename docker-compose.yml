services:
  node_target:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - backend

  fastapi_proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:8000"
    depends_on:
      - node_target
    networks:
      - backend

networks:
  backend: